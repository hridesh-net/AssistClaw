[package]
name = "assistclaw-tui"
version = "0.1.0"
edition = "2024"
authors = ["AssistClaw Team"]
license = "MIT"

[lib]
name = "assistclaw_tui"
crate-type = ["staticlib"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.29", features = ["event-stream"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"
unicode-segmentation = "1.12"
strip-ansi-escapes = "0.2"
color-eyre = "0.6"
textwrap = "0.16"
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
