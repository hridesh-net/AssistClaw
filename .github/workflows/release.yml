name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - os: macos-latest
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - os: macos-latest
            target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - os: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          
      - name: Install MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Install Linux dependencies
        if: matrix.target == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Setup Zig
        if: matrix.target == 'linux-arm64'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
          
      - name: Build Binary (Native)
        if: matrix.target != 'linux-arm64'
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.os == 'windows-latest' && 'gcc' || '' }}
        run: |
          mkdir -p dist
          go build -mod=vendor -tags fts5 -ldflags "-s -w" -o dist/assistclaw-${{ matrix.target }}${{ matrix.ext }} ./cmd/assistclaw

      - name: Build Binary (Linux ARM64 Cross-Compile with Zig)
        if: matrix.target == 'linux-arm64'
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: arm64
          CC: zig cc -target aarch64-linux-musl
          CXX: zig c++ -target aarch64-linux-musl
        run: |
          mkdir -p dist
          # Use -extldflags "-static" to ensure no glibc dependencies
          go build -mod=vendor -tags fts5 -ldflags "-s -w -extldflags '-static'" -o dist/assistclaw-${{ matrix.target }}${{ matrix.ext }} ./cmd/assistclaw

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin-archives
          merge-multiple: true
          
      - name: Create Release Notes
        id: release_notes
        run: |
          mkdir -p dist
          cp bin-archives/* dist/ || true
          echo "## AssistClaw ${GITHUB_REF_NAME}" > release_notes.md
          echo "Automated release build." >> release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
